<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Staff Attendance with QR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial,"Noto Sans Khmer",sans-serif; background:#f2f4f7; display:flex; justify-content:center; align-items:flex-start; padding-top:20px; }
        .card { background:#fff; width:100%; max-width:380px; padding:20px; border-radius:14px; box-shadow:0 10px 25px rgba(0,0,0,.1); margin-bottom:20px; }
        h2 { text-align:center; margin-bottom:14px; color: #2563eb; }
        label { font-size:14px; font-weight: bold; }
        input, select, textarea { width:100%; padding:10px; margin:6px 0 12px; border-radius:8px; border:1px solid #ccc; font-size:14px; box-sizing: border-box; }
        textarea { display:none; height: 60px; border: 1px solid #ff4d4d; }
        .time-box { background:#eef2ff; padding:10px; border-radius:8px; text-align:center; font-weight:bold; margin-bottom:12px; color: #2563eb; }
        button { width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:10px; font-size:16px; margin-bottom:10px; cursor: pointer; }
        button:active { background: #1e40af; }
        #qrcode { display:flex; justify-content:center; margin-top:10px; }
    </style>
</head>
<body>
<div class="card">
    <h2>📋 Staff Attendance</h2>

    <label>ឈ្មោះពេញ</label>
    <input id="name" placeholder="បញ្ចូលឈ្មោះ" required>

    <label>តួនាទី</label>
    <input id="role" placeholder="បញ្ចូលតួនាទី" required>

    <label>ប្រភេទ</label>
    <select id="type" onchange="checkTime()">
        <option value="checkin">Check-in</option>
        <option value="checkout">Check-out</option>
    </select>

    <div class="time-box" id="timeBox">🕒 --:-- | 📅 --/--/----</div>

    <label id="reasonLabel" style="display:none; color:red;">⚠️ មូលហេតុ (យឺត/ចេញមុន)</label>
    <textarea id="reason" placeholder="សូមបំពេញមូលហេតុ"></textarea>

    <button onclick="processAttendance()">Generate QR & Send to Telegram</button>

    <div id="qrcode"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const TELEGRAM_BOT_TOKEN = "8242266919:AAGE6uMJ_-UvM-3KBZkJVFhJyTLvcTVW5tQ";
const TELEGRAM_CHAT_ID = "1346632543";
const OFFICIAL_IN = "07:15";
const OFFICIAL_OUT = "17:15";

function getNow(){
    const now = new Date();
    const time = now.toTimeString().slice(0,5);
    const date = now.toLocaleDateString("en-GB");
    return {time,date};
}

// បន្ថែម Function គណនានាទីយឺត
function calculateLateMinutes(currentTime, officialTime) {
    const [curH, curM] = currentTime.split(':').map(Number);
    const [offH, offM] = officialTime.split(':').map(Number);
    const currentTotal = (curH * 60) + curM;
    const officialTotal = (offH * 60) + offM;
    return currentTotal > officialTotal ? currentTotal - officialTotal : 0;
}

function checkTime(){
    const {time} = getNow();
    const type = document.getElementById("type").value;
    const reason = document.getElementById("reason");
    const label = document.getElementById("reasonLabel");

    let needReason = false;
    if(type==="checkin" && time > OFFICIAL_IN) needReason=true;
    if(type==="checkout" && time < OFFICIAL_OUT) needReason=true;

    reason.style.display = needReason ? "block" : "none";
    label.style.display = needReason ? "block" : "none";
}

function updateTime(){
    const {time,date} = getNow();
    document.getElementById("timeBox").innerText = `🕒 ${time} | 📅 ${date}`;
    checkTime();
}
updateTime();
setInterval(updateTime, 60000);

async function sendToTelegram(message) {
    const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
    try {
        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: "HTML"
            })
        });
        const data = await response.json();
        if (!response.ok) alert("Telegram Error: " + data.description);
        else alert("✅ បញ្ជូនទៅ Telegram ជោគជ័យ!");
    } catch (error) {
        alert("Network Error: មិនអាចភ្ជាប់ទៅ Telegram!");
    }
}

function processAttendance() {
    const name = document.getElementById("name").value.trim();
    const role = document.getElementById("role").value.trim();
    const type = document.getElementById("type").value;
    const reason = document.getElementById("reason").value.trim();
    const {time, date} = getNow();

    if(!name || !role){
        alert("សូមបំពេញឈ្មោះ និង តួនាទី");
        return;
    }

    // គណនានាទីយឺត
    let lateInfo = "";
    if (type === "checkin") {
        const lateMinutes = calculateLateMinutes(time, OFFICIAL_IN);
        if (lateMinutes > 0) lateInfo = `\n⏰ <b>យឺត:</b> ${lateMinutes} នាទី`;
    }

    let displayText = `🔔 <b>Attendance Report</b>\n`;
    displayText += `━━━━━━━━━━━━━━━━━━\n`;
    displayText += `👤 <b>ឈ្មោះ:</b> ${name}\n`;
    displayText += `💼 <b>តួនាទី:</b> ${role}\n`;
    displayText += `📍 <b>ស្ថានភាព:</b> ${type === 'checkin' ? '✅ Check-in' : '🚪 Check-out'}\n`;
    displayText += `📅 <b>ថ្ងៃខែ:</b> ${date}\n`;
    displayText += `🕒 <b>ម៉ោង:</b> ${time}${lateInfo}`;
    if(reason) displayText += `\n⚠️ <b>មូលហេតុ:</b> ${reason}`;
    displayText += `\n━━━━━━━━━━━━━━━━━━`;

    // បង្កើត QR Code
    document.getElementById("qrcode").innerHTML="";
    new QRCode(document.getElementById("qrcode"), {
        text: displayText.replace(/<[^>]*>/g, ''),
        width: 180, height: 180
    });

    sendToTelegram(displayText);
}
</script>
</body>
</html>
