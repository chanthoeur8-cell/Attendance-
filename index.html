<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធស្កែនវត្តមាន - Mikid International School</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Khmer OS Battambang', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #eef2f3; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-main { background-color: #007bff; color: white; margin-top: 10px; }
        .btn-checkin { background-color: #28a745; color: white; }
        .btn-checkout { background-color: #dc3545; color: white; }
        .btn-send { background-color: #6f42c1; color: white; margin-top: 15px; }
        .hidden { display: none !important; }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; background: #f0f0f0; margin-bottom: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">ចុះឈ្មោះដំបូង</h2>
    
    <div id="setup-form">
        <input type="text" id="fullname" placeholder="ឈ្មោះពេញ">
        <input type="tel" id="phone" placeholder="លេខទូរស័ព្ទ">
        <input type="text" id="role" placeholder="តួនាទី (ឧទាហរណ៍៖ គ្រូបង្រៀន)">
        <button class="btn-main" onclick="saveProfile()">រក្សាទុកទិន្នន័យ</button>
    </div>

    <div id="attendance-section" class="hidden">
        <div class="status-badge" id="display-name"></div>
        <div style="color: #666; font-size: 14px; margin-bottom: 20px;" id="display-role"></div>
        
        <div id="action-buttons">
            <button class="btn-checkin" onclick="handleCheckIn()">Check In</button>
            <div style="height: 10px;"></div>
            <button class="btn-checkout" onclick="handleCheckOut()">Check Out</button>
        </div>

        <div id="reason-section" class="hidden">
            <hr>
            <h4 id="status-label" style="color: #dc3545;"></h4>
            <textarea id="reason" rows="3" placeholder="សូមបញ្ជាក់មូលហេតុ..."></textarea>
            <button class="btn-send" onclick="submitAttendance()">បញ្ជូនទិន្នន័យ</button>
            <button style="background:none; color: gray; font-size: 13px;" onclick="cancelAction()">បោះបង់</button>
        </div>
        
        <button style="background:none; color: #ccc; font-size: 10px; margin-top: 20px;" onclick="clearData()">ចុះឈ្មោះឡើងវិញ</button>
    </div>
</div>

<script>
    const TELEGRAM_TOKEN = '8242266919:AAGE6uMJ_-UvM-3KBZkJVFhJyTLvcTVW5tQ'; 
    const CHAT_ID = '-1003584563383'; 

    let currentStatus = "";
    let isReasonRequired = false;

    window.onload = function() {
        checkUserStatus();
    };

    function checkUserStatus() {
        const storedData = localStorage.getItem('staff_info');
        if (storedData) {
            showAttendanceUI(JSON.parse(storedData));
        } else {
            document.getElementById('setup-form').classList.remove('hidden');
            document.getElementById('attendance-section').classList.add('hidden');
            document.getElementById('title').innerText = "ចុះឈ្មោះដំបូង";
        }
    }

    function saveProfile() {
        const name = document.getElementById('fullname').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const role = document.getElementById('role').value.trim();
        if (!name || !phone || !role) return Swal.fire('សូមបំពេញឱ្យគ្រប់!', '', 'warning');
        
        const userInfo = { name, phone, role };
        localStorage.setItem('staff_info', JSON.stringify(userInfo));
        showAttendanceUI(userInfo);
    }

    function showAttendanceUI(user) {
        document.getElementById('setup-form').classList.add('hidden');
        document.getElementById('attendance-section').classList.remove('hidden');
        document.getElementById('title').innerText = "ស្កែនវត្តមាន";
        document.getElementById('display-name').innerText = user.name;
        document.getElementById('display-role').innerText = "តួនាទី៖ " + user.role;
    }

    function handleCheckIn() {
        const now = new Date();
        const timeString = now.toLocaleString('km-KH', { hour12: true });
        localStorage.setItem('last_checkin_time', timeString);

        const hour = now.getHours();
        const minute = now.getMinutes();
        
        if (hour > 7 || (hour === 7 && minute > 30)) {
            isReasonRequired = true;
            prepareSubmission('ចូលយឺត (Late In)', 'អ្នកមកយឺត! សូមបញ្ជាក់មូលហេតុ៖');
        } else {
            isReasonRequired = false;
            currentStatus = "ចូលធ្វើការ (Check In)";
            submitAttendance(); 
        }
    }

    function handleCheckOut() {
        const now = new Date();
        const hour = now.getHours();
        if (hour < 17) {
            isReasonRequired = true;
            prepareSubmission('ចេញមុន (Early Out)', 'អ្នកចេញមុនម៉ោង! សូមបញ្ជាក់មូលហេតុ៖');
        } else {
            isReasonRequired = false;
            currentStatus = "ចេញពីធ្វើការ (Check Out)";
            submitAttendance(); 
        }
    }

    function prepareSubmission(status, label) {
        currentStatus = status;
        document.getElementById('action-buttons').classList.add('hidden');
        document.getElementById('reason-section').classList.remove('hidden');
        document.getElementById('status-label').innerText = label;
    }

    function cancelAction() {
        document.getElementById('action-buttons').classList.remove('hidden');
        document.getElementById('reason-section').classList.add('hidden');
        document.getElementById('reason').value = "";
    }

    function submitAttendance() {
        const reason = document.getElementById('reason').value.trim();
        if (isReasonRequired && !reason) return Swal.fire('សូមបំពេញមូលហេតុ!', '', 'error');

        const user = JSON.parse(localStorage.getItem('staff_info'));
        const checkInTime = localStorage.getItem('last_checkin_time');
        const currentTime = new Date().toLocaleString('km-KH', { hour12: true });

        let message = `📊 **របាយការណ៍វត្តមានបុគ្គលិក**\n`;
        message += `👤 **ឈ្មោះ៖** ${user.name}\n`;
        message += `💼 **តួនាទី៖** ${user.role}\n`;
        message += `----------------------------\n`;

        if (currentStatus.includes("Check Out") || currentStatus.includes("Early Out")) {
            message += `✅ **ម៉ោងចូល៖** ${checkInTime || 'មិនមានទិន្នន័យ'}\n`;
            message += `🚪 **ម៉ោងចេញ៖** ${currentTime}\n`;
            message += `📍 **ស្ថានភាព៖** ${currentStatus}\n`;
        } else {
            message += `✅ **ស្ថានភាព៖** ${currentStatus}\n`;
            message += `⏰ **ម៉ោងចូល៖** ${currentTime}\n`;
        }

        if (reason) message += `📝 **មូលហេតុ៖** ${reason}\n`;
        message += `----------------------------\n`;
        message += `📞 **ទូរស័ព្ទ៖** ${user.phone}`;

        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

        Swal.fire({ title: 'កំពុងបញ្ជូន...', didOpen: () => { Swal.showLoading(); } });

        fetch(url).then(res => {
            if (res.ok) {
                Swal.fire('ជោគជ័យ!', 'របាយការណ៍ត្រូវបានផ្ញើ', 'success').then(() => cancelAction());
            } else {
                Swal.fire('Error', 'ការផ្ញើមានបញ្ហា', 'error');
            }
        }).catch(() => Swal.fire('Error', 'បញ្ហាអ៊ីនធឺណិត', 'error'));
    }

    function clearData() {
        Swal.fire({
            title: 'ចុះឈ្មោះថ្មី?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'បាទ',
            cancelButtonText: 'ទេ'
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.clear();
                location.reload();
            }
        });
    }
</script>
</body>
</html>
