<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធស្កែនវត្តមាន - Attendance System</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Khmer OS Battambang', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #eef2f3; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-main { background-color: #007bff; color: white; margin-top: 10px; }
        .btn-checkin { background-color: #28a745; color: white; }
        .btn-checkout { background-color: #dc3545; color: white; }
        .btn-send { background-color: #6f42c1; color: white; margin-top: 15px; }
        .hidden { display: none; }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; background: #f0f0f0; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">ចុះឈ្មោះដំបូង</h2>
    
    <div id="setup-form">
        <input type="text" id="fullname" placeholder="ឈ្មោះពេញ">
        <input type="tel" id="phone" placeholder="លេខទូរស័ព្ទ">
        <input type="text" id="role" placeholder="តួនាទី (ឧទាហរណ៍៖ IT)">
        <button class="btn-main" onclick="saveProfile()">រក្សាទុកទិន្នន័យ</button>
    </div>

    <div id="attendance-section" class="hidden">
        <div class="status-badge" id="display-name"></div>
        <div style="color: #666; font-size: 14px; margin-bottom: 20px;" id="display-role"></div>
        
        <div id="action-buttons">
            <button class="btn-checkin" onclick="prepareSubmission('ចូលធ្វើការ (Check In)')">Check In</button>
            <div style="height: 10px;"></div>
            <button class="btn-checkout" onclick="prepareSubmission('ចេញពីធ្វើការ (Check Out)')">Check Out</button>
        </div>

        <div id="reason-section" class="hidden">
            <hr>
            <h4 id="status-label"></h4>
            <textarea id="reason" rows="3" placeholder="សូមបញ្ជាក់មូលហេតុនៅទីនេះ..."></textarea>
            <button class="btn-send" onclick="submitAttendance()">ផ្ញើទៅ Telegram</button>
            <button style="background:none; color: gray; font-size: 13px;" onclick="cancelAction()">បោះបង់</button>
        </div>
    </div>
</div>

<script>
    // --- កន្លែងដាក់ Token របស់អ្នក ---
    const TELEGRAM_TOKEN = '8242266919:AAGE6uMJ_-UvM-3KBZkJVFhJyTLvcTVW5tQ'; 
    const CHAT_ID = '-1003584563383'; 

    let currentStatus = "";

    window.onload = function() {
        const user = JSON.parse(localStorage.getItem('staff_info'));
        if (user) {
            showAttendanceUI(user);
        }
    };

    function saveProfile() {
        const name = document.getElementById('fullname').value;
        const phone = document.getElementById('phone').value;
        const role = document.getElementById('role').value;

        if (!name || !phone || !role) {
            return Swal.fire('សូមបំពេញឱ្យគ្រប់!', '', 'warning');
        }

        const userData = { name, phone, role };
        localStorage.setItem('staff_info', JSON.stringify(userData));
        showAttendanceUI(userData);
    }

    function showAttendanceUI(user) {
        document.getElementById('setup-form').classList.add('hidden');
        document.getElementById('attendance-section').classList.remove('hidden');
        document.getElementById('title').innerText = "ស្កែនវត្តមាន";
        document.getElementById('display-name').innerText = user.name;
        document.getElementById('display-role').innerText = "តួនាទី៖ " + user.role;
    }

    // មុខងារបង្ហាញប្រអប់មូលហេតុ
    function prepareSubmission(status) {
        currentStatus = status;
        document.getElementById('action-buttons').classList.add('hidden');
        document.getElementById('reason-section').classList.remove('hidden');
        document.getElementById('status-label').innerText = "បញ្ជាក់មូលហេតុសម្រាប់ " + status;
    }

    function cancelAction() {
        document.getElementById('action-buttons').classList.remove('hidden');
        document.getElementById('reason-section').classList.add('hidden');
        document.getElementById('reason').value = "";
    }

    function submitAttendance() {
        const reason = document.getElementById('reason').value;

        if (!reason) {
            return Swal.fire('សូមបំពេញមូលហេតុ!', 'អ្នកត្រូវតែបញ្ជាក់មូលហេតុមុននឹងបន្ត', 'error');
        }

        const user = JSON.parse(localStorage.getItem('staff_info'));
        const time = new Date().toLocaleString('en-GB', { hour12: true });

        // បង្កើតសារសម្រាប់ផ្ញើទៅ Telegram
        let message = `🔔 **ការជូនដំណឹងវត្តមាន**\n`;
        message += `--------------------------\n`;
        message += `👤 **ឈ្មោះ៖** ${user.name}\n`;
        message += `📞 **លេខទូរស័ព្ទ៖** ${user.phone}\n`;
        message += `💼 **តួនាទី៖** ${user.role}\n`;
        message += `📍 **ស្ថានភាព៖** ${currentStatus}\n`;
        message += `📝 **មូលហេតុ៖** ${reason}\n`;
        message += `⏰ **ម៉ោង៖** ${time}\n`;
        message += `--------------------------`;

        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

        Swal.fire({ title: 'កំពុងបញ្ជូន...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        fetch(url).then(res => {
            if (res.ok) {
                Swal.fire('ជោគជ័យ!', 'វត្តមានរបស់អ្នកត្រូវបានកត់ត្រា', 'success').then(() => {
                    location.reload(); 
                });
            } else {
                Swal.fire('បរាជ័យ', 'មិនអាចផ្ញើទិន្នន័យបានទេ សូមឆែក Bot Token!', 'error');
            }
        }).catch(err => {
            Swal.fire('Error', 'មានបញ្ហាអ៊ីនធឺណិត', 'error');
        });
    }
</script>

</body>
</html>
